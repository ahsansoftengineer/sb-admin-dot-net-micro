syntax = "proto3";

option csharp_namespace = "SBA.Auth.Grpc.Model";

import "SBA.Auth.Grpc.Base";

package SBA.Auth.Grpc.Model;

service GrpcLookupSrvc {
    rpc GetAllLookups (GetAllRequest) returns (LookupRes);
}

message GetAllRequest {}

message GrpcLookup {
    int32 id = 1;
    string name = 2;
    int32 status = 3;
    string desc = 4;
}

message GrpcLookups {
    repeated GrpcLookup lookup = 1;
}