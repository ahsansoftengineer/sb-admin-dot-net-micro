syntax = "proto3";

option csharp_namespace = "SBA.Projectz.Grpc.Base";

package SBA.Projectz.Grpc.Base;

message BaseGrpcByIdStr {
    string id = 1;
}

message BaseGrpcById {
    int32 id = 1;
}

message BaseGrpcUpdateStatus {
    int32 status = 1;
}

message BaseGrpcCreate {
    string name = 2;
    int32 status = 3;
    string desc = 4;
}

message BaseGrpcUpdate {
    int32 id = 1;
    string name = 2;
    int32 status = 3;
    string desc = 4;
}

message BaseGrpcGets { }

message BaseGrpcGet { }

message BaseGrpcProjectzLookups {
    repeated BaseGrpcUpdate ProjectzLookups = 1;
}

message BaseGrpcProjectzLookup {
    BaseGrpcUpdate ProjectzLookup = 1;
}

message BaseGrpcRes {
    int32 status = 1;
    string message = 2;
}