#### (3) DB Claim (Dev) 

# - This Task Done Only Once
# - Creating Claim for Database
# kubectl get pvc -n sba-dev
# kubectl get pvc claim-mssql -n sba-dev
# kubectl delete pvc claim-mssql -n sba-dev
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claim-mssql
  namespace: sba-dev
spec:
  resources:
    requests:
      storage: 500Mi
  accessModes:
  - ReadWriteMany

---
#### (3) DB StatefulSet (Dev) 
# - kubectl get statefulset -n sba-dev
# - kubectl get statefulset sfs-mssql -n sba-dev
# - kubectl delete statefulset sfs-mssql -n sba-dev
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sfs-mssql
  namespace: sba-dev
spec:
  serviceName: srvc-cip-mssql
  replicas: 1
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
    spec:
      enableServiceLinks: false   # ✅ disables auto-injected env vars
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          resources:
            limits:
              memory: 2Gi # --> Ubuntu 1Gi / Windows 2Gi
              cpu: "1"
            requests:
              memory: 2Gi # --> Ubuntu 1Gi / Windows 2Gi
              cpu: "1"
          env:
            - name: MSSQL_PID
              value: "Express"
            - name: ACCEPT_EULA
              value: "Y"
            # - name: SA_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: mssql
            #       key: SA_PASSWORD
            # The commented-out line should be removed if you're using the secret reference
            - name: SA_PASSWORD
              value: "P@55w0rd!123"
          volumeMounts:
            - mountPath: /var/opt/mssql/data
              name: mssqldb
      initContainers:
        - name: fix-perms
          image: busybox
          command: ["sh", "-c", "chown -R 10001:0 /var/opt/mssql"]
          volumeMounts:
            - name: mssqldb
              mountPath: /var/opt/mssql
      volumes:
        - name: mssqldb
          persistentVolumeClaim:
            claimName: claim-mssql

---
#---------------------------------------------# 
#### (4) DB ClusterIP (Dev)
# - We need ClusterIP for Inter Service Communication
# - Production Required
# - kubectl get svc -n sba-dev
# - kubectl get svc srvc-cip-mssql -n sba-dev
apiVersion: v1
kind: Service
metadata:
  name: srvc-cip-mssql
  namespace: sba-dev
spec:
  type: ClusterIP
  selector:
    app: mssql
  ports:
    - name: mssql
      protocol: TCP
      port: 1433 # Port -> Cluster 
      targetPort: 1433 # Port -> (Pod / Container)

---
#---------------------------------------------#
#### (5) DB NodePort (Dev) (Optional)
# - We need NodePort for (PC) External Service Access
# - No Production Required
# - kubectl get svc srvc-np-mssql -n sba-dev
# - CREADENTIALS 127.0.0.1,32000 sa 'P@55w0rd!123'
apiVersion: v1
kind: Service
metadata:
  name: srvc-np-mssql
  namespace: sba-dev
spec:
  type: NodePort
  selector:
    app: mssql
  ports:
    - protocol: TCP
      port: 1433
      targetPort: 1433
      nodePort: 32000 # 30000-32767 (Host Port)

---

#---------------------------------------------#
#### (6) DB LoadBalancer (Dev)
# - We need LoadBalancer for (Public) External Service Access
# - No Production Required
# - kubectl get svc srvc-lb-mssql -n sba-dev
## Creadentials for LoadBalancer
# - Not Working 127.0.0.1,1433 sa 'P@55w0rd!123'
apiVersion: v1
kind: Service
metadata:
  name: srvc-lb-mssql
  namespace: sba-dev
spec:
  type: LoadBalancer
  selector:
    app: mssql
  ports:
    - protocol: TCP
      port: 2000 # External
      targetPort: 1433